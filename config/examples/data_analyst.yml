pipeline:
  instant_threshold: 85
  digest_threshold: 70
  digest_max_items: 15

sources:
  greenhouse:
    enabled: true
    boards:
      - stripe
      - datadog
      - elastic
      - gitlab
    content: true

scoring:
  include:
    roles:
      - "data analyst"
      - "analytics engineer"
      - "product analyst"
      - "business analyst"
      - "insight analyst"
      - "bi analyst"
      - "product manager"
      - "technical product manager"
      - "project manager"
      - "operations manager"
      - "program manager"
      - "cybersecurity"
      - "security analyst"
      - "information security"
      - "payments analyst"
      - "fraud analyst"
      - "risk manager"
    skills:
      - "sql"
      - "python"
      - "postgres"
      - "dbt"
      - "tableau"
      - "looker"
      - "power bi"
      - "stakeholder management"
      - "product roadmap"
      - "agile"
      - "scrum"
      - "market analysis"
      - "kpi"
      - "soc2"
      - "iso 27001"
      - "grc"
      - "incident response"
      - "vulnerability management"
      - "aml"
      - "kyc"
      - "payment processing"
      - "ledger"
      - "reconciliation"
  exclude:
    keywords:
      - "intern"
      - "stage"
      - "tirocinio"
      - "call center"
      - "promoter"
      - "volunteer"
      - "graduate"
      - "entry level" 
      - "internship"
      - "apprentice"
  weights: {}

storage:
  sqlite_path: "data/jobintel.sqlite"

notify:
  mode: "stdout"
  telegram:
    bot_token: ""
    chat_id: ""
